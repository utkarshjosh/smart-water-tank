# AquaMind v1 App Information Layer Refresh Scope

**Issue:** UTK-11  
**Status:** Scoped for implementation  
**Date:** 2026-07-18  
**Primary app surface:** `frontend-v2`

## Objective

Refresh the v1 AquaMind app information layer so early consumers can understand their water status, trust what the app is saying, and know the next action without reading device-management language.

This is a scoping layer, not a full redesign. It defines the copy, hierarchy, states, events, analytics, and API dependencies needed to turn the current app into a clearer v1 release loop.

## Current Surface Baseline

The current `frontend-v2` app already covers the minimum consumer journey:

- Public entry: landing page, login, signup, password reset.
- Authenticated consumer app: home, tank list, tank detail, alerts, pairing, insights placeholder, settings.
- Platform/admin app: platform overview, devices, firmware, tenants and users.
- Existing backend data exposed to the app: devices, current measurement, history, alerts, alert acknowledgement, claim code, device config, firmware, tenants, users.

Key gaps for the information layer:

- The app often says what page the user is on, but not what changed, what is stale, what action matters, or why.
- AI/forecasting language is intentionally placeholder-only; v1 needs honest insufficient-data states and future-ready evidence slots.
- Alerts are visible, but alert lifecycle and severity semantics are thin.
- Pairing explains code creation, but not the full activation path from sensor paired to accurate tank profile to first trusted reading.
- Settings does not yet carry notification, units, timezone, or feedback capture information.
- Analytics and feedback events are not scoped into the app surfaces, so activation and trust cannot be measured.

## V1 Information Architecture

### Public and Auth

Purpose: convert interested users into a signed-in product loop without overexplaining platform roles.

Screens:

- Landing
- Login
- Signup
- Reset password

Information hierarchy:

1. Product promise: real-time tank status and early attention signals.
2. Trust cue: data comes from a paired AquaMind sensor and is labelled when stale or incomplete.
3. Primary action: create account or sign in.
4. Secondary support: reset password and configuration error state.

Copy standards:

- Use &quot;tank&quot;, &quot;sensor&quot;, &quot;reading&quot;, &quot;alert&quot;, and &quot;history&quot;; avoid firmware/protocol language for public users.
- Do not claim leak detection or prediction certainty until those services are implemented.
- When Firebase is not configured, keep the message local/dev-specific and out of production builds.

### Home

Purpose: answer &quot;Is my water okay right now?&quot;

Information hierarchy:

1. Highest-priority active issue across accessible tanks.
2. Main tank current level, volume, freshness, and status.
3. Next action: acknowledge/check alert, set up tank profile, pair sensor, or view detail.
4. Supporting context: recent update time, number of other tanks, guidance availability.

Required states:

- No tanks: pair first sensor.
- Paired but no tank profile: set up dimensions before volume can be trusted.
- Tank profile exists but no reading: waiting for first reading, with expected wait copy.
- Reading stale/offline: show last known value as historical, not live.
- Active alert: foreground severity, affected tank, and recommended action.
- Normal: show current level and last reading with no unnecessary warning language.

### Tanks

Purpose: let users scan every accessible tank and choose where to inspect.

Information hierarchy:

1. Tanks needing attention first.
2. Search and filters for status, stale/offline, low/full, and profile missing.
3. Each tank card: name, status, level percent, estimated volume, last reading, active alert, profile completeness.

V1 scope:

- Add empty and no-results states.
- Keep tank cards compact but make status reason explicit.
- Do not hide critical context behind hover-only interactions.

### Tank Detail

Purpose: explain current state, recent change, and evidence.

Information hierarchy:

1. Header: tank name, level, volume, status, last reading, primary action.
2. Current measurement quality: live/recent/stale/offline, estimated vs unavailable.
3. History chart with selected range and units.
4. Event timeline: alerts, low/full crossings, offline periods, profile/config changes, future fill events.
5. Forecast/insight slot: honest unavailable or insufficient-data state until prediction service exists.
6. Alert settings and tank setup action.

Required copy/state rules:

- If `level_percent_stale` or status is offline, label the reading as last known.
- If profile is missing, avoid presenting litres as accurate.
- If history is empty, show the next troubleshooting action.
- Forecast cards must state why unavailable: service not connected, insufficient valid history, or no profile.

### Alerts

Purpose: show what needs a human decision.

Information hierarchy:

1. Open critical/high alerts.
2. Acknowledged or lower-severity alerts.
3. Tank, severity, timestamp, plain-language message, and action.

V1 scope:

- Keep acknowledgement as the only action if backend lifecycle remains limited.
- Add severity definitions in copy/tooltips or detail affordance.
- Group alert copy around user meaning: &quot;Low water&quot;, &quot;Possible leak&quot;, &quot;Device offline&quot;, &quot;Sensor data issue&quot;, &quot;Battery low&quot;.

### Pairing and Activation

Purpose: turn a new user into a trusted first reading.

Information hierarchy:

1. Create secure claim code.
2. Enter code on sensor setup surface.
3. Confirm sensor appears.
4. Set tank profile.
5. Wait for first reading and validate accuracy.

V1 scope:

- Rename &quot;Finish&quot; copy so users know tank setup is not optional for accurate volume.
- Add post-pair next action: set dimensions, thresholds, and expected reporting interval.
- Capture pairing failure reasons where the backend returns them.

### Insights

Purpose: prepare for AI guidance without pretending it exists.

Information hierarchy:

1. Current availability state.
2. Data needed before predictions can be trusted.
3. Future evidence model: conclusion, confidence, evidence, action, feedback.

V1 scope:

- Keep predictions disabled until backend data exists.
- Add future-ready state labels: unavailable, collecting data, ready.
- Add feedback event contract for future helpful/not helpful capture.

### Settings

Purpose: let users control account and notification expectations.

Information hierarchy:

1. Account identity and workspace.
2. Notification preferences once supported.
3. Units/timezone once supported.
4. Sign out.

V1 scope:

- Show clear &quot;coming next&quot; states tied to missing APIs.
- Avoid implying notification channels are active before delivery is implemented.

## Data Contracts Needed For Implementation

Existing fields are enough for a copy/state refresh, but the following additions would improve v1 quality:

| Surface | Needed field/API | Why it matters |
|---|---|---|
| Home, Tanks, Tank Detail | `reading_freshness_state` or `expected_reporting_interval_sec` | Distinguish live, recent, stale, and offline without hardcoding timing in UI. |
| Home, Tanks | `status_reason` | Explain why the app says a tank needs attention. |
| Tanks, Detail | `capacity_l`, `usable_capacity_l`, `has_tank_profile` | Make estimated volume trustworthy and avoid misleading litres. |
| Alerts | alert `recommended_action`, `source`, `resolved_at` | Make alerts actionable and prepare for lifecycle display. |
| Pairing | claim-code expiry and post-claim device discovery state | Reduce onboarding confusion and support failures. |
| Insights | prediction availability endpoint | Differentiate not connected, insufficient data, and ready states. |
| Settings | notification preference endpoint | Let users control alert channels when delivery ships. |

## Analytics Scope

Add a lightweight app analytics wrapper before or during implementation. Events should carry `user_id`, `tenant_id`, `role`, `device_id` when relevant, `screen`, `timestamp`, and a privacy-safe `source`.

V1 events:

- `public_landing_viewed`
- `signup_started`
- `signup_completed`
- `login_completed`
- `pairing_started`
- `claim_code_created`
- `pairing_step_completed`
- `tank_profile_setup_started`
- `first_reading_seen`
- `home_viewed`
- `tank_detail_opened`
- `history_range_changed`
- `alert_seen`
- `alert_acknowledged`
- `settings_opened`
- `insight_placeholder_seen`
- `empty_state_action_clicked`
- `api_error_seen`

Activation metric:

- A user is activated when they have a paired device, a completed tank profile, and have viewed the first valid reading.

Reliability metric:

- Track the percentage of user sessions that see stale/offline/no-data states and the top API errors by surface.

Trust metric:

- Track acknowledgement rate, profile completion rate, and future insight feedback rate.

## Implementation Slices

### Slice 1: Consumer state language

Update Home, Tanks, Tank Detail, Alerts, Pairing, Insights, and Settings copy/state logic in `frontend-v2`.

Acceptance:

- Every consumer screen has explicit empty, loading, error, stale/offline, and success copy where data can be missing.
- Tank litres are labelled as estimated and are not overtrusted when profile data is missing.
- Forecast/AI copy remains unavailable or collecting-data until backend support exists.

### Slice 2: Activation path polish

Make pairing lead directly into tank profile completion and first-reading expectations.

Acceptance:

- A new user can understand the sequence from claim code to accurate water volume.
- The no-tank, no-profile, no-reading, and first-reading states each have one clear primary action.

### Slice 3: Alerts and evidence

Make alerts more action-oriented and connect Tank Detail to evidence.

Acceptance:

- Alert cards show severity, affected tank, time, plain-language issue, and available action.
- Tank Detail shows no-data and stale-data evidence without presenting old readings as live.

### Slice 4: Analytics foundation

Add a minimal analytics interface and emit v1 activation/reliability events.

Acceptance:

- Events can be disabled locally and safely no-op when no provider is configured.
- Core activation events fire from signup, pairing, tank detail, alert acknowledgement, and error states.
- Event payloads do not include secrets, raw Firebase tokens, or sensitive hardware credentials.

## Out Of Scope For This Refresh

- Autonomous pump/valve control.
- Payments, pricing, billing, or revenue collection.
- Full AI prediction implementation.
- Reports/export implementation.
- Tenant Admin analytics redesign beyond copy alignment.
- Firmware rollout workflow changes.
- Hardware manufacturing or sensor firmware changes.
- Legal/privacy policy decisions.

## Follow-Up Issues Created

1. UTK-24: Implement AquaMind v1 consumer state language in `frontend-v2`.
2. UTK-25: Add v1 pairing-to-profile activation path polish.
3. UTK-26: Add AquaMind frontend analytics wrapper and v1 activation events.
4. UTK-27: Extend backend device summary API with freshness/status reason fields.
5. UTK-28: Define alert lifecycle and recommended-action API fields.

## Open Decisions

- Which analytics destination should v1 use: self-hosted endpoint, PostHog, Firebase Analytics, or no-op interface first?
- What reporting interval should define live/recent/stale/offline for the current hardware firmware?
- Which notification channels are committed for v1: in-app only, push, email, SMS/WhatsApp, or later?
- Should Tenant Admins be part of the first app refresh, or should v1 focus on consumer household users first?

## Verification Plan

Smallest useful verification for the implementation issue:

- Run `npm run build` or the repo&#x27;s frontend typecheck/build command for `frontend-v2`.
- Manually inspect responsive states for landing, home, tanks, tank detail, alerts, pairing, insights, and settings.
- Use fixture/mock states for no tank, no profile, no reading, stale reading, active alert, and normal reading.
- Confirm analytics no-op behavior in local development.

        document.addEventListener('DOMContentLoaded', () => {
            mermaid.initialize({ startOnLoad: false, theme: 'dark' });

            const rawMarkdown = document.getElementById('raw-markdown').innerHTML;
            
            // Configure marked
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true
            });

            const contentEl = document.getElementById('content');
            contentEl.innerHTML = marked.parse(rawMarkdown);

            // Handle Mermaid blocks
            const codeBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
            codeBlocks.forEach((codeBlock, i) => {
                const pre = codeBlock.parentElement;
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = codeBlock.textContent;
                pre.replaceWith(mermaidDiv);
            });

            mermaid.run();

            // Build Table of Contents
            const tocEl = document.getElementById('toc');
            const headings = contentEl.querySelectorAll('h1, h2, h3');
            
            headings.forEach((heading, index) => {
                const id = 'heading-' + index;
                heading.id = id;

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + id;
                a.className = 'toc-link' + (heading.tagName === 'H3' ? ' toc-sub' : '');
                a.textContent = heading.textContent;
                
                li.appendChild(a);
                tocEl.appendChild(li);
            });

            // Highlight Active TOC link on scroll
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('.toc-link').forEach(link => {
                            link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
                        });
                    }
                });
            }, { rootMargin: '-20% 0px -70% 0px' });

            headings.forEach(heading => observer.observe(heading));
        });
    </script>
