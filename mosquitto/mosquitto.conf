# AquaMind production Mosquitto template for a native Ubuntu installation.
# Do not indent comments: Mosquitto treats leading whitespace before `#` as a
# configuration token. Install as /etc/mosquitto/mosquitto.conf.

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

log_dest syslog
connection_messages true
allow_anonymous false

# Backend only. Never expose plaintext MQTT publicly.
listener 1883 127.0.0.1

# Devices connect only with MQTT over TLS.
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
require_certificate false
tls_version tlsv1.2

max_packet_size 16384
max_inflight_messages 20

include_dir /etc/mosquitto/conf.d
