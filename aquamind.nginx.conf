# AquaMind Nginx Configuration
# Place this file in /etc/nginx/sites-available/aquamind
# Then link it: sudo ln -s /etc/nginx/sites-available/aquamind /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Frontend - Admin Panel (static Vite/React build)
server {
    listen 80;
    listen [::]:80;
    server_name aquamind.utkarshjoshi.com;

    root /var/www/aquamind;
    index index.html;

    # SPA fallback so client-side routes (e.g. /admin/dashboard) don't 404 on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed asset filenames; index.html is never cached so
    # deploys are picked up immediately
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html and version.json must never be cached (by the browser or by
    # Cloudflare) - the frontend polls version.json to detect new deploys and
    # silently reload, which only works if this response is always fresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# Backend - API
server {
    listen 80;
    listen [::]:80;
    server_name aquamind-api.utkarshjoshi.com;

    # Increase body size limit for file uploads
    client_max_body_size 10M;

    # Proxy to backend API
    location / {
        proxy_pass http://localhost:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3011/health;
        access_log off;
    }
}
